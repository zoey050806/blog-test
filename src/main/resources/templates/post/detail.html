<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title th:text="${post.title}">Post Title</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Post Header -->
        <article>
            <header class="mb-4">
                <h1 class="mb-3" th:text="${post.title}">Post Title</h1>
                <div class="d-flex flex-wrap align-items-center text-muted mb-3">
                    <span th:if="${post.category}" class="badge bg-primary me-2">
                        <a th:href="@{/categories/{slug}(slug=${post.category.slug})}"
                           class="text-white text-decoration-none"
                           th:text="${post.category.name}">Category</a>
                    </span>
                    <span class="me-3">
                        <i class="bi bi-calendar3"></i>
                        <span th:text="${#temporals.format(post.publishedAt != null ? post.publishedAt : post.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                    </span>
                    <span class="me-3">
                        <i class="bi bi-eye"></i>
                        <span th:text="${post.viewCount}">0</span> views
                    </span>
                    <span th:if="${post.author}" class="me-3">
                        <i class="bi bi-person"></i>
                        <span th:text="${post.author.displayName}">Author</span>
                    </span>
                </div>
                <div class="d-flex flex-wrap gap-1 mb-3">
                    <a th:each="tag : ${post.tags}"
                       th:href="@{/tags/{slug}(slug=${tag.slug})}"
                       class="badge bg-secondary text-decoration-none"
                       th:text="${tag.name}">tag</a>
                </div>
                <!-- Cover Image -->
                <img th:if="${post.coverImage != null && !post.coverImage.isBlank()}"
                     th:src="@{/uploads/{filename}(filename=${post.coverImage})}"
                     class="img-fluid rounded mb-3 w-100"
                     style="max-height: 400px; object-fit: cover;"
                     th:alt="${post.title}">
            </header>

            <!-- Post Content (Markdown) -->
            <div class="markdown-body" th:attr="data-markdown=${post.content}"></div>
        </article>

        <hr class="my-5">

        <!-- Comments Section -->
        <section>
            <h3 class="mb-4">
                <i class="bi bi-chat-dots"></i>
                Comments (<span th:text="${comments != null ? comments.size() : 0}">0</span>)
            </h3>

            <!-- Comment Success Message -->
            <div th:if="${commentSuccess}" class="alert alert-success" th:text="${commentSuccess}"></div>
            <div th:if="${commentError}" class="alert alert-danger" th:text="${commentError}"></div>

            <!-- Comments List -->
            <div th:if="${comments != null && !comments.isEmpty()}">
                <div th:each="comment : ${comments}" class="card mb-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div>
                                <strong th:text="${comment.authorName}">Name</strong>
                                <small class="text-muted ms-2"
                                       th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</small>
                            </div>
                            <button class="btn btn-sm btn-outline-secondary reply-btn"
                                    th:attr="data-comment-id=${comment.id}"
                                    onclick="document.getElementById('parentId').value = this.dataset.commentId; document.getElementById('replyTo').textContent = 'Replying to ' + this.closest('.card-body').querySelector('strong').textContent; document.getElementById('replyIndicator').classList.remove('d-none'); document.getElementById('commentForm').scrollIntoView();">
                                Reply
                            </button>
                        </div>
                        <p class="card-text" th:text="${comment.content}">Comment content...</p>

                        <!-- Nested Replies -->
                        <div th:if="${comment.replies != null && !comment.replies.isEmpty()}" class="ms-4 mt-3">
                            <div th:each="reply : ${comment.replies}"
                                 th:if="${reply.status.name() == 'APPROVED'}"
                                 class="border-start border-3 border-primary ps-3 mb-2">
                                <div>
                                    <strong th:text="${reply.authorName}">Name</strong>
                                    <small class="text-muted ms-2"
                                           th:text="${#temporals.format(reply.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</small>
                                </div>
                                <p class="mb-0 small" th:text="${reply.content}">Reply...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:unless="${comments != null && !comments.isEmpty()}" class="text-muted mb-4">
                <p>No comments yet. Be the first to share your thoughts!</p>
            </div>

            <!-- Comment Form -->
            <div class="card" id="commentForm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Leave a Comment</h5>
                </div>
                <div class="card-body">
                    <div id="replyIndicator" class="alert alert-info d-none">
                        <span id="replyTo"></span>
                        <button type="button" class="btn-close float-end"
                                onclick="document.getElementById('parentId').value = ''; document.getElementById('replyIndicator').classList.add('d-none');"></button>
                    </div>
                    <form th:action="@{/posts/{slug}/comments(slug=${post.slug})}" method="post">
                        <input type="hidden" id="parentId" name="parentId" value="">
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="authorName" class="form-label">Name *</label>
                                <input type="text" class="form-control" id="authorName" name="authorName"
                                       required maxlength="50" placeholder="Your name">
                            </div>
                            <div class="col-md-6">
                                <label for="authorEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="authorEmail" name="authorEmail"
                                       maxlength="100" placeholder="your@email.com">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="content" class="form-label">Comment *</label>
                            <textarea class="form-control" id="content" name="content" rows="4"
                                      required maxlength="2000" placeholder="Write your comment..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i> Submit Comment
                        </button>
                        <small class="text-muted ms-2">Your comment will be reviewed before publishing.</small>
                    </form>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
