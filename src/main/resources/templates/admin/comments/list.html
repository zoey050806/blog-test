<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title>Manage Comments</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="mb-4">Comments</h1>

        <!-- Comments Table -->
        <div class="card" th:if="${comments != null && !comments.content.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Author</th>
                            <th>Content</th>
                            <th>Post</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="comment : ${comments.content}">
                            <td>
                                <div th:text="${comment.authorName}">Name</div>
                                <small class="text-muted" th:text="${comment.authorEmail}">email</small>
                            </td>
                            <td>
                                <small th:text="${#strings.length(comment.content) > 80 ? #strings.substring(comment.content, 0, 80) + '...' : comment.content}">Content</small>
                            </td>
                            <td>
                                <a th:href="@{/posts/{slug}(slug=${comment.post.slug})}" target="_blank"
                                   class="small" th:text="${comment.post.title}">Post Title</a>
                            </td>
                            <td>
                                <span th:if="${comment.status.name() == 'PENDING'}" class="badge bg-warning text-dark">Pending</span>
                                <span th:if="${comment.status.name() == 'APPROVED'}" class="badge bg-success">Approved</span>
                                <span th:if="${comment.status.name() == 'SPAM'}" class="badge bg-danger">Spam</span>
                            </td>
                            <td><small th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">2024</small></td>
                            <td>
                                <div class="d-flex gap-1">
                                    <!-- Approve -->
                                    <form th:action="@{/admin/comments/{id}/approve(id=${comment.id})}" method="post" class="d-inline"
                                          th:if="${comment.status.name() != 'APPROVED'}">
                                        <button class="btn btn-sm btn-outline-success" title="Approve">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                    </form>
                                    <!-- Mark as Spam -->
                                    <form th:action="@{/admin/comments/{id}/spam(id=${comment.id})}" method="post" class="d-inline"
                                          th:if="${comment.status.name() != 'SPAM'}">
                                        <button class="btn btn-sm btn-outline-warning" title="Mark as Spam">
                                            <i class="bi bi-shield-x"></i>
                                        </button>
                                    </form>
                                    <!-- Delete -->
                                    <form th:action="@{/admin/comments/{id}/delete(id=${comment.id})}" method="post" class="d-inline"
                                          onsubmit="return confirm('Delete this comment?');">
                                        <button class="btn btn-sm btn-outline-danger" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- No comments -->
        <div th:unless="${comments != null && !comments.content.isEmpty()}" class="text-center py-5">
            <i class="bi bi-chat-dots" style="font-size: 3rem; color: #ccc;"></i>
            <h4 class="text-muted mt-3">No comments yet</h4>
        </div>

        <!-- Pagination -->
        <div class="mt-3" th:with="currentPath='/admin/comments'">
            <div th:replace="~{fragments/pagination :: pagination(${comments})}"></div>
        </div>
    </div>
</body>
</html>
