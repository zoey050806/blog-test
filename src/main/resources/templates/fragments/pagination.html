<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="pagination(page)" th:if="${page != null && page.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <!-- Previous -->
            <li class="page-item" th:classappend="${page.isFirst()} ? 'disabled' : ''">
                <a class="page-link" th:href="@{${currentPath}(page=${page.number - 1}, size=${page.size})}"
                   th:unless="${page.isFirst()}" aria-label="Previous">
                    &laquo;
                </a>
                <span class="page-link" th:if="${page.isFirst()}">&laquo;</span>
            </li>

            <!-- Page Numbers -->
            <th:block th:with="start=${page.number - 2 < 0 ? 0 : page.number - 2},
                              end=${page.number + 2 > page.totalPages ? page.totalPages : page.number + 2},
                              startAdjusted=${start < 0 ? 0 : (end - start < 5 ? (end - 5 < 0 ? 0 : end - 5) : start)},
                              endAdjusted=${end > page.totalPages ? page.totalPages : (end - startAdjusted < 5 ? (startAdjusted + 5 > page.totalPages ? page.totalPages : startAdjusted + 5) : end)}">
                <li th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:if="${i >= startAdjusted && i < endAdjusted}"
                    class="page-item" th:classappend="${i == page.number} ? 'active' : ''">
                    <a class="page-link" th:href="@{${currentPath}(page=${i}, size=${page.size})}"
                       th:text="${i + 1}">1</a>
                </li>
            </th:block>

            <!-- Next -->
            <li class="page-item" th:classappend="${page.isLast()} ? 'disabled' : ''">
                <a class="page-link" th:href="@{${currentPath}(page=${page.number + 1}, size=${page.size})}"
                   th:unless="${page.isLast()}" aria-label="Next">
                    &raquo;
                </a>
                <span class="page-link" th:if="${page.isLast()}">&raquo;</span>
            </li>
        </ul>
    </nav>
</body>
</html>
