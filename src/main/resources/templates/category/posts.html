<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title th:text="${category.name}">Category</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="mb-2" th:text="${category.name}">Category Name</h1>
        <p class="text-muted mb-4" th:if="${category.description}" th:text="${category.description}">Description</p>

        <!-- No Posts Message -->
        <div th:if="${posts == null || posts.content.isEmpty()}" class="text-center py-5">
            <i class="bi bi-folder2-open" style="font-size: 3rem; color: #ccc;"></i>
            <h4 class="text-muted mt-3">No posts in this category</h4>
        </div>

        <!-- Post Cards (same as home) -->
        <article th:each="post : ${posts.content}" class="card mb-4 post-card">
            <div class="card-body">
                <div class="d-flex align-items-center mb-2">
                    <span th:if="${post.isTop}" class="badge bg-danger me-2">Pinned</span>
                    <small class="text-muted">
                        <i class="bi bi-calendar3"></i>
                        <span th:text="${#temporals.format(post.publishedAt != null ? post.publishedAt : post.createdAt, 'yyyy-MM-dd')}">2024-01-01</span>
                    </small>
                    <small class="text-muted ms-3">
                        <i class="bi bi-eye"></i>
                        <span th:text="${post.viewCount}">0</span> views
                    </small>
                </div>
                <h2 class="card-title h5">
                    <a th:href="@{/posts/{slug}(slug=${post.slug})}"
                       class="text-decoration-none text-dark"
                       th:text="${post.title}">Post Title</a>
                </h2>
                <p class="card-text text-muted" th:text="${post.summary}">Summary...</p>
                <div class="d-flex flex-wrap gap-1">
                    <span th:each="tag : ${post.tags}" class="badge bg-secondary"
                          th:text="${tag.name}">tag</span>
                </div>
            </div>
        </article>

        <!-- Pagination -->
        <div th:with="currentPath='/categories/' + ${category.slug}">
            <div th:replace="~{fragments/pagination :: pagination(${posts})}"></div>
        </div>
    </div>
</body>
</html>
