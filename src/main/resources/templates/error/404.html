<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Page Not Found</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="text-center py-5">
            <h1 class="display-1 text-muted">404</h1>
            <i class="bi bi-emoji-frown text-muted" style="font-size: 3rem;"></i>
            <h2 class="mt-3">Page Not Found</h2>
            <p class="text-muted" th:text="${message != null ? message : 'The page you are looking for does not exist.'}">
                The page you are looking for does not exist.
            </p>
            <a th:href="@{/}" class="btn btn-primary mt-3">
                <i class="bi bi-house"></i> Back to Home
            </a>
        </div>
    </div>
</body>
</html>
