<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>Server Error</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="text-center py-5">
            <h1 class="display-1 text-muted">500</h1>
            <i class="bi bi-exclamation-triangle text-warning" style="font-size: 3rem;"></i>
            <h2 class="mt-3">Internal Server Error</h2>
            <p class="text-muted" th:text="${message != null ? message : 'Something went wrong. Please try again later.'}">
                Something went wrong. Please try again later.
            </p>
            <a th:href="@{/}" class="btn btn-primary mt-3">
                <i class="bi bi-house"></i> Back to Home
            </a>
        </div>
    </div>
</body>
</html>
